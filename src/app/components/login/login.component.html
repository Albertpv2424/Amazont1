<div class="login-container" [ngClass]="{'dark-mode': isDarkMode}" role="main">
  <div class="login-card">
    <div class="logo-container">
      <img 
        [src]="isDarkMode ? 'assets/amazont en blanc.png' : 'assets/amazont.png'" 
        alt="Logo de Amazon't" 
        class="auth-logo">
    </div>
    
    <h2 id="login-heading">Iniciar sesión</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" aria-labelledby="login-heading">
      <div class="form-group">
        <label for="email" id="email-label">Correo electrónico</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          [ngClass]="{'is-invalid': submitted && f['email'].errors}"
          aria-required="true"
          aria-describedby="email-error"
          [attr.aria-invalid]="submitted && f['email'].errors ? 'true' : 'false'"
        >
        <div *ngIf="submitted && f['email'].errors" class="error-message" id="email-error" aria-live="polite">
          <div *ngIf="f['email'].errors['required']">El correo electrónico es obligatorio</div>
          <div *ngIf="f['email'].errors['email']">Introduce un correo electrónico válido</div>
        </div>
      </div>
      
      <div class="form-group password-group">
        <label for="password" id="password-label">Contraseña</label>
        <div class="password-input-container">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            formControlName="password" 
            [ngClass]="{'is-invalid': submitted && f['password'].errors}"
            aria-required="true"
            aria-describedby="password-error"
            [attr.aria-invalid]="submitted && f['password'].errors ? 'true' : 'false'"
          >
          <button 
            type="button" 
            class="toggle-password" 
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="showPassword"
          >
            <img 
              [src]="showPassword ? 'assets/eyeicon.png' : 'assets/eyeicon.png'" 
              alt="" 
              aria-hidden="true">
          </button>
        </div>
        <div *ngIf="submitted && f['password'].errors" class="error-message" id="password-error" aria-live="polite">
          <div *ngIf="f['password'].errors['required']">La contraseña es obligatoria</div>
        </div>
      </div>
      
      <div *ngIf="loginError" class="error-message login-error" aria-live="assertive">
        Correo electrónico o contraseña incorrectos
      </div>
      
      <button type="submit" class="btn-login">Iniciar sesión</button>
      
      <div class="forgot-password">
        <a routerLink="/recuperar-password" tabindex="0">¿Olvidaste tu contraseña?</a>
      </div>
      
      <div class="register-link">
        ¿No tienes una cuenta? <a routerLink="/registro" tabindex="0">Regístrate</a>
      </div>
    </form>
  </div>
</div>
