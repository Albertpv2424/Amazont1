<div class="producto" role="article" aria-labelledby="producto-titulo">
  <div 
    class="producto-content" 
    (click)="navegarAProducto()" 
    role="button" 
    tabindex="0" 
    [attr.aria-label]="'Ver detalles de ' + producto.nombre"
    (keyup.enter)="navegarAProducto()" 
    (keyup.space)="navegarAProducto()"
  >
    <img 
      class="imagggg" 
      [src]="'assets/' + producto.imagen" 
      [alt]="producto.nombre" 
    />
    <p id="producto-titulo">
      {{ producto.nombre }}
      <span class="descuento" aria-label="Descuento">{{ producto.descuento }}</span>
    </p>
  </div>

  <button 
    class="btn-agregar-carrito" 
    (click)="agregarAlCarrito()" 
    [attr.aria-label]="'Añadir ' + producto.nombre + ' al carrito'"
  >
    Añadir al carrito
  </button>
</div>
